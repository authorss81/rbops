name: validate

# RBOPS validating itself. This workflow has NO LLM in it and must never be
# edited by a phase — see AGENTS.md hard rule 1. Its job is to prove the
# pipeline's own integrity is intact before any agent runs against it.
#
# NOTE ON SHELL: GitHub runs `run:` blocks under `bash -e`. Several checks
# below end a loop body with `[ cond ] && { ... }`, which returns 1 when the
# condition is false and would abort the step. Every such construct is written
# as an explicit if/fi or suffixed with `|| true`.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - 'docs/audits/**'
      - 'phases/*/PROMPT.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: manifest + prompts are consistent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: manifest is valid JSON and well-formed
        run: |
          set -uo pipefail
          jq empty rbops/phases.json
          n=$(jq '.phases | length' rbops/phases.json)
          echo "phases declared: $n"
          if [ "$n" -gt 0 ]; then echo "OK"; else echo "::error::manifest declares no phases"; exit 1; fi

      - name: phase ids are unique and well-formed
        run: |
          set -uo pipefail
          rc=0
          dup=$(jq -r '.phases[].id' rbops/phases.json | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::duplicate phase ids: $dup"; rc=1; else echo "OK: ids unique"; fi
          # `grep -v` exits 1 when it filters out everything, which under `bash -e`
          # would abort the step even though the result is what we want.
          bad=$(jq -r '.phases[].id' rbops/phases.json | grep -vE '^phase-[0-9]{3}$' || true)
          if [ -n "$bad" ]; then echo "::error::malformed phase ids: $bad"; rc=1; else echo "OK: ids well-formed"; fi
          exit "$rc"

      - name: every depends_on resolves
        run: |
          set -uo pipefail
          rc=0
          ids=$(jq -r '.phases[].id' rbops/phases.json)
          while read -r dep; do
            if ! printf '%s\n' "$ids" | grep -qx -- "$dep"; then
              echo "::error::$dep is referenced but not declared"; rc=1
            fi
          done < <(jq -r '.phases[].depends_on[]?' rbops/phases.json)
          if [ "$rc" -eq 0 ]; then echo "OK: all dependencies declared"; fi
          exit "$rc"

      - name: dependency graph is acyclic
        run: |
          set -uo pipefail
          remaining=$(jq -r '.phases[].id' rbops/phases.json)
          for _ in $(seq 1 64); do
            if [ -z "$remaining" ]; then break; fi
            progress=0
            for id in $remaining; do
              unmet=0
              while read -r d; do
                if printf '%s\n' "$remaining" | grep -qx -- "$d"; then unmet=1; fi
              done < <(jq -r --arg p "$id" '.phases[]|select(.id==$p)|.depends_on[]?' rbops/phases.json)
              if [ "$unmet" -eq 0 ]; then
                # `grep -vx` exits 1 when the line being removed is the last one.
                # Under `bash -e` that would abort the step mid-algorithm.
                remaining=$(printf '%s\n' "$remaining" | grep -vx -- "$id" || true)
                progress=1
              fi
            done
            if [ "$progress" -eq 0 ]; then break; fi
          done
          if [ -n "$remaining" ]; then
            echo "::error::dependency cycle among: $(echo $remaining)"
            exit 1
          fi
          echo "OK: graph is acyclic"

      - name: every declared phase has a committed PROMPT.md
        run: |
          set -uo pipefail
          rc=0
          while read -r id; do
            if [ ! -f "phases/$id/PROMPT.md" ]; then
              echo "::error::missing phases/$id/PROMPT.md"; rc=1
            fi
          done < <(jq -r '.phases[].id' rbops/phases.json)
          if [ "$rc" -eq 0 ]; then echo "OK: every phase has a prompt"; fi
          exit "$rc"

      - name: PROMPT.md files match the manifest
        run: ./rbops/gen-prompts.sh --check

      - name: shell scripts are syntactically valid and executable
        run: |
          set -uo pipefail
          # Keep the exec bit correct in git; a mode regression would otherwise
          # surface as a bare "exit 126" with no explanation.
          chmod +x rbops/*.sh
          git update-index --chmod=+x rbops/*.sh || true
          for f in rbops/*.sh; do
            bash -n "$f" || exit 1
            if [ ! -x "$f" ]; then echo "::error::$f is not executable"; exit 1; fi
          done
          echo "OK: shell syntax + exec bits"

      - name: workflow YAML parses
        run: |
          set -uo pipefail
          for f in .github/workflows/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1
            echo "OK: $f"
          done

  gate-selfcheck:
    name: verify.sh still has all its checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: the gate must not have been weakened
        run: |
          set -uo pipefail
          rc=0
          # The baseline lives in the manifest, so lowering it is a visible diff
          # that a reviewer has to approve.
          while read -r needle; do
            if ! grep -qF -- "$needle" rbops/verify.sh; then
              echo "::error::gate lost a check: $needle"; rc=1
            fi
          done < <(jq -r '.gate.selfcheck.required_needles[]' rbops/phases.json)
          want=$(jq -r '.gate.selfcheck.min_assertions' rbops/phases.json)
          have=$(grep -cE '^[[:space:]]*(ok|bad) ' rbops/verify.sh)
          echo "gate assertions: $have (baseline $want)"
          if [ "$have" -lt "$want" ]; then
            echo "::error::gate assertion count dropped"; rc=1
          fi
          if [ "$rc" -eq 0 ]; then echo "OK: gate intact"; fi
          exit "$rc"