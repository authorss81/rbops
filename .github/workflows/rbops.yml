name: rbops

# =============================================================================
# RBOPS — self-dispatching, self-auditing pipeline for the redblue language.
#
# Unlike the llops design, this one cannot be fooled by an agent that merely
# claims success. `rbops/verify.sh` is a real gate whose non-zero exit blocks
# `.done`, and it runs the four gates itself.
#
# The bot token deliberately has NO `workflows` permission, so a push that
# touches .github/ is refused by GitHub. That is the lock that makes the gate
# trustworthy: the implementer cannot edit its own gate.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Force a phase (e.g. phase-001). Empty = auto-select."
        required: false
        default: ""
      action:
        description: "tick | run | review | audit | status"
        required: false
        default: "tick"
      no_retrigger:
        description: "Do not chain to the next tick"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - 'docs/audits/**'
  repository_dispatch:
    types: [rbops_tick]

permissions:
  contents: read

# ONE PHASE AT A TIME. Without this, a retrigger arriving while the previous
# phase is still editing redblue `main` starts a second agent against the same
# working tree: two commits race, one push is rejected, both phases burn tokens,
# and the loser's work can be silently lost in the rebase. `cancel-in-progress:
# false` is deliberate — cancelling mid-phase would kill the agent between its
# 300s checkpoints and lose the working-tree changes.
#
# A queued run is not wasted: when it finally starts, `select` re-reads the
# committed markers, finds the phase already .done, and exits in seconds.
concurrency:
  group: rbops-pipeline
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # select: checkout + `dispatch.sh select`. The workflow does NOT reimplement
  # phase selection in YAML — that duplication is how the previous version came
  # to believe the queue was drained while 23 phases were pending. One source of
  # truth: rbops/dispatch.sh.
  # ---------------------------------------------------------------------------
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      phase:   ${{ steps.s.outputs.phase }}
      exists:  ${{ steps.s.outputs.exists }}
      action:  ${{ steps.s.outputs.action }}
    steps:
      - uses: actions/checkout@v4

      - name: Select phase
        id: s
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -uo pipefail
          ACTION="${INPUT_ACTION:-tick}"
          PHASE="${INPUT_PHASE}"

          if [ -f phases/.stop ]; then
            echo "::notice::phases/.stop present — pipeline halted."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ACTION" = "audit" ] || [ "$ACTION" = "status" ]; then
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "phase="       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PHASE" ]; then
            PHASE=$(./rbops/dispatch.sh select 2>/dev/null | tail -1)
          fi

          if [ -n "$PHASE" ]; then
            echo "::notice::selected $PHASE"
            echo "phase=$PHASE"   >> "$GITHUB_OUTPUT"
            echo "exists=true"    >> "$GITHUB_OUTPUT"
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          else
            ./rbops/dispatch.sh status || true
            echo "::notice::queue drained."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "phase="       >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # work: clone redblue, run the dispatcher. contents:write is required to
  # push phase work; it is NOT granted any workflow scope, so the bot cannot
  # rewrite its own gate.
  # ---------------------------------------------------------------------------
  work:
    needs: select
    if: needs.select.outputs.exists == 'true' && needs.select.outputs.action != 'status'
    runs-on: ubuntu-latest
    # A phase gets a real budget, but not an unlimited one. The previous default
    # was 360 minutes; a lost agent should not occupy a runner for six hours.
    timeout-minutes: 150
    permissions:
      contents: write          # push phase work. NO `workflows` scope.
    outputs:
      # Did the pipeline advance? rc 0 means the gate is green and the phase is
      # awaiting review. 42 deferred / 3 blocked / 1 gate-failed are all "no
      # progress" and must not chain.
      progress: ${{ steps.d.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install jq and ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ripgrep

      - name: Install opencode (pinned)
        run: |
          # 1.15.12 is what llops-android pins, but the free tier now requires
          # >=1.18.0 and every opencode/* model fails with "OpenCode 1.18.0 or
          # newer is required to use the free tier".
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.34
          # $GITHUB_PATH only affects LATER steps, so the binary must be called
          # by absolute path here or this step dies with exit 127.
          "$HOME/.opencode/bin/opencode" --version
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rbops-${{ runner.os }}-${{ hashFiles('rbops/phases.json') }}
          restore-keys: rbops-${{ runner.os }}-

      - name: Clone redblue with push access
        env:
          # GITHUB_TOKEN is scoped to the repository the workflow runs in, so it
          # CANNOT push to redblue no matter what `permissions:` says.
          # Two supported credentials, in order:
          #   1. REDBLUE_DEPLOY_KEY — private half of an SSH deploy key with
          #      write access on redblue. Least privilege, nothing to rotate by
          #      hand. Created once, scripted: rbops/setup-deploy-key.ps1.
          #      Re-running that script rotates the key.
          #   2. REDBLUE_TOKEN — fine-grained PAT, Contents R/W on redblue.
          REDBLUE_DEPLOY_KEY: ${{ secrets.REDBLUE_DEPLOY_KEY }}
          REDBLUE_TOKEN: ${{ secrets.REDBLUE_TOKEN }}
        run: |
          set -uo pipefail
          OWNER="${{ github.repository_owner }}"
          SSHKEY="$HOME/.ssh/rbops_redblue"

          if [ -n "${REDBLUE_DEPLOY_KEY:-}" ]; then
            mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
            # The secret holds base64 (single line, newline-immune); older
            # rotations stored raw PEM, which is still accepted.
            if printf '%s' "$REDBLUE_DEPLOY_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
              printf '%s' "$REDBLUE_DEPLOY_KEY" > "$SSHKEY"
            else
              printf '%s' "$REDBLUE_DEPLOY_KEY" | base64 -d > "$SSHKEY" \
                || { echo "::error::REDBLUE_DEPLOY_KEY is neither PEM nor base64"; exit 1; }
            fi
            chmod 600 "$SSHKEY"
            # Safe diagnostics, always printed: byte count and the PUBLIC
            # fingerprint. Neither leaks the key, and together they settle any
            # "server rejected the key" question in one glance — compare with
            # the fingerprint printed by rbops/setup-deploy-key.ps1.
            echo "key bytes: $(wc -c < "$SSHKEY")"
            ssh-keygen -lf "$SSHKEY" 2>&1 || echo "::error::key file is not a valid private key"
            ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts_rbops" 2>/dev/null
            if ! grep -q 'github.com ssh-ed25519' "$HOME/.ssh/known_hosts_rbops"; then
              echo "::error::ssh-keyscan returned no host key — cannot trust github.com"
              exit 1
            fi
            SSHOPTS="ssh -i $SSHKEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_rbops -o StrictHostKeyChecking=yes"
            echo "GIT_SSH_COMMAND=$SSHOPTS" >> "$GITHUB_ENV"
            export GIT_SSH_COMMAND="$SSHOPTS"
            git clone --depth 50 "git@github.com:${OWNER}/redblue.git" redblue
            echo "::notice::cloned over SSH (deploy key)"
          elif [ -n "${REDBLUE_TOKEN:-}" ]; then
            git clone --depth 50 "https://github.com/${OWNER}/redblue.git" redblue
            git -C redblue remote set-url origin \
              "https://x-access-token:${REDBLUE_TOKEN}@github.com/${OWNER}/redblue.git"
            echo "::notice::cloned over HTTPS (PAT)"
          else
            git clone --depth 50 "https://github.com/${OWNER}/redblue.git" redblue
            echo "::warning::no REDBLUE_DEPLOY_KEY or REDBLUE_TOKEN — the clone can read but NOT push."
            echo "::warning::phase work will be captured as work-<phase>.patch but not pushed."
          fi
          git -C redblue config user.name  "rbops-bot"
          git -C redblue config user.email "rbops-bot@users.noreply.github.com"

          # THE CRITICAL PATH SETTING. dispatch.sh keeps its state in the rbops
          # repo but the agent must edit redblue. Without this the agent runs in
          # the rbops checkout, cannot find src/testing/harness.rs, burns its
          # whole budget searching, and its output is discarded.
          echo "RBOPS_PROJECT_DIR=$PWD/redblue" >> "$GITHUB_ENV"

          # Prove write access now, and SHOW git's actual stderr.
          #
          # `probe="$(cmd)"` inherits cmd's exit status, so under `bash -e` a
          # failed push aborts the step on the assignment and the stderr never
          # reaches the log. Hence `|| prc=$?`: capture the code first, then the
          # output, and never let a failed probe kill the run.
          prc=0
          probe="$(git -C redblue push --dry-run origin HEAD:main 2>&1)" || prc=$?
          printf '%s\n' "$probe" | sed 's/^/    /'
          if [ "$prc" -eq 0 ]; then
            echo "::notice::redblue push access verified"
          else
            echo "::warning::redblue push NOT available (exit $prc) — work is captured as an artifact, not pushed"
          fi
          exit 0

      - name: Fetch resume branches (WIP checkpoints + recovery)
        continue-on-error: true
        run: |
          git -C redblue fetch origin "+refs/heads/rbops-wip/*:refs/remotes/origin/rbops-wip/*" \
            || echo "::notice::no WIP checkpoints to resume"
          # Gate-failed attempts park their tree on rbops-recovery/<phase> so a
          # retry builds on prior work instead of re-rolling from zero.
          git -C redblue fetch origin "+refs/heads/rbops-recovery/*:refs/remotes/origin/rbops-recovery/*" \
            || echo "::notice::no recovery branches to resume"

      # Warm the build so the phase's own gate is fast.
      - name: Warm cargo cache
        working-directory: redblue
        run: cargo build --all-targets

      - name: Dispatch
        id: d
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Optional. Only needed if you add openrouter/* models to the chains
          # below; the default chains are opencode/* only so a single key is
          # sufficient.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RBOPS_PHASE: ${{ needs.select.outputs.phase }}
          RBOPS_RETRIGGER: ${{ inputs.no_retrigger && '0' || '1' }}
          # Model order matters and is cheap to get wrong. space-bunny-free is
          # the strongest coder available on the free tier, so it leads;
          # muse-spark 1.3 is the first fallback because a dead model advances
          # the chain without consuming a phase attempt, so an unavailable entry
          # costs seconds rather than a retry budget.
          RBOPS_IMPL_MODELS: opencode/space-bunny-free,opencode/muse-spark-1.3-contributor-free,opencode/muse-spark-1.2-contributor-free,opencode/big-pickle,opencode/nemotron-3-ultra-free,opencode/nemotron-3.5-lightning-free,opencode/mimo-v2.5-free
          RBOPS_REVIEW_MODELS: opencode/muse-spark-1.3-contributor-free,opencode/space-bunny-free,opencode/nemotron-3-ultra-free,opencode/big-pickle
          RBOPS_AUDIT_MODELS: opencode/space-bunny-free,opencode/muse-spark-1.3-contributor-free,opencode/big-pickle,opencode/nemotron-3-ultra-free
          RBOPS_MODEL_TIMEOUT: 3000
          RBOPS_MAX_REVIEW_ROUNDS: 3
        run: |
          set -uo pipefail
          PHASE="${RBOPS_PHASE}"
          # Promote to GITHUB_ENV: the commit, state-push and report steps all
          # reference RBOPS_PHASE, and under `set -u` an unset variable aborts
          # the step. It was step-scoped to this one and killed Report status.
          echo "RBOPS_PHASE=$PHASE" >> "$GITHUB_ENV"
          # Refuse to run rather than silently point the agent at the wrong tree.
          if [ ! -d "${RBOPS_PROJECT_DIR:-.}/.git" ] && [ ! -f "${RBOPS_PROJECT_DIR:-.}/Cargo.toml" ]; then
            echo "::error::RBOPS_PROJECT_DIR='${RBOPS_PROJECT_DIR:-unset}' is not the redblue checkout"
            echo "progress=false" >> "$GITHUB_OUTPUT"
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ needs.select.outputs.action }}" = "audit" ]; then
            bash rbops/dispatch.sh audit; rc=$?
          else
            bash rbops/dispatch.sh run "$PHASE" || rc=$?
            rc=${rc:-0}
            if [ "$rc" = "0" ]; then
              bash rbops/dispatch.sh review "$PHASE" || rc=$?
            fi
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Only a clean run counts as progress. A deferred phase is retried by
          # the cron safety net instead, so a dead model chain cannot spawn an
          # unbounded queue of runs that all hit the same wall.
          if [ "$rc" = "0" ]; then
            echo "progress=true" >> "$GITHUB_OUTPUT"
          else
            echo "progress=false" >> "$GITHUB_OUTPUT"
            echo "::warning::rc=$rc — not chaining; the cron safety net will retry"
          fi

      - name: Preserve and push phase work
        if: always()
        env:
          GIT_NAME: rbops-bot
          GIT_EMAIL: rbops-bot@users.noreply.github.com
          RBOPS_PHASE: ${{ env.RBOPS_PHASE }}
          PROGRESS: ${{ steps.d.outputs.progress }}
        run: |
          set -uo pipefail
          PHASE="${RBOPS_PHASE:-none}"
          cd redblue
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

          # DIAGNOSE FIRST. A phase once produced 788 changed lines and the old
          # version of this step cheerfully reported "clean tree — nothing to
          # push". Nothing is lost now that this runs first and is unconditional.
          echo "::group::work inventory for ${PHASE}"
          echo "  HEAD          : $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
          echo "  local commits : $(git log --oneline origin/main..HEAD 2>/dev/null | wc -l)"
          echo "  status lines  : $(git status --porcelain | wc -l)"
          echo "  diff vs HEAD  : $(git diff HEAD --shortstat)"
          echo "  staged        : $(git diff --cached --shortstat)"
          git status --porcelain | head -20 | sed 's/^/    /'
          echo "::endgroup::"

          # ALWAYS capture a patch, before any commit, push or reset. If every
          # later step fails the work is still recoverable from the artifact.
          git add -A
          git diff --cached --binary > "../work-${PHASE}.patch" || true
          echo "patch bytes: $(wc -c < "../work-${PHASE}.patch")"

          has_local_commits() { [ -n "$(git log --oneline origin/main..HEAD 2>/dev/null)" ]; }
          has_staged()        { ! git diff --cached --quiet; }

          # The agent may have committed its own work. `git status --porcelain`
          # is EMPTY in that case, which is how a whole phase was once discarded.
          if ! has_staged && ! has_local_commits; then
            echo "::notice::genuinely nothing to push for ${PHASE}"
            exit 0
          fi

          if has_staged; then
            git commit -m "rbops: ${PHASE} ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || true
          fi

          # POLICY: only gate-green, reviewed work lands on main. A failed gate
          # means the code is unproven — possibly correct, possibly not — and
          # unproven code does not belong on the language's main branch. It goes
          # to a recovery branch instead, where the next attempt (or a human)
          # can inspect it, and to the patch artifact either way.
          if [ "${PROGRESS:-false}" != "true" ]; then
            echo "::warning::gate did not pass for ${PHASE} — keeping main clean, parking work on rbops-recovery/${PHASE}"
            git branch -f "rbops-recovery/${PHASE}" HEAD 2>/dev/null || true
            git push -f origin "HEAD:refs/heads/rbops-recovery/${PHASE}" 2>/dev/null \
              || echo "::warning::recovery-branch push also failed; work-${PHASE}.patch artifact still holds the work"
            exit 0
          fi

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "::notice::pushed ${PHASE}"; exit 0; fi
            git pull --rebase origin main || true
            sleep 3
          done

          git branch -f "rbops-recovery/${PHASE}" HEAD 2>/dev/null || true
          git push -f origin "HEAD:refs/heads/rbops-recovery/${PHASE}" 2>/dev/null || true
          echo "::error::push failed after 5 attempts — recovery branch and work-${PHASE}.patch artifact saved"

      - name: Push RBOPS state
        if: always()
        run: |
          set -uo pipefail
          git config user.name rbops-bot
          git config user.email rbops-bot@users.noreply.github.com
          mkdir -p phases logs
          cp -r redblue/phases/. phases/ 2>/dev/null || true
          cp -r redblue/logs/. logs/ 2>/dev/null || true
          [ -n "$(git status --porcelain phases logs)" ] || { echo "no state change"; exit 0; }
          git add phases logs
          git commit -m "rbops: state after ${RBOPS_PHASE}" || exit 0
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || true; sleep 3
          done

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbops-${{ needs.select.outputs.phase || 'audit' }}
          path: |
            work-*.patch
            recovery-*.patch
            logs/*.log
          retention-days: 14

      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RBOPS_PHASE: ${{ env.RBOPS_PHASE }}
        run: |
          set -uo pipefail
          PHASE="${RBOPS_PHASE:-none}"
          rc="${{ steps.d.outputs.rc }}"
          echo "phase=${PHASE} rc=${rc:-unknown}"
          # Markers live in the PIPELINE repo (phases/), not in redblue/.
          # Looking for them under redblue/ meant this never fired and no
          # blocked-issue was ever filed.
          if [ ! -d "phases/${PHASE}" ]; then
            echo "::notice::no phase directory for '${PHASE}' — nothing to report"
            exit 0
          fi
          if [ -f "phases/${PHASE}/.blocked" ]; then
            TITLE="RBOPS blocked: ${PHASE}"
            # Capture then grep: under `pipefail`, `gh ... | grep -q` inherits
            # gh's exit status, so a transient API failure would look like "no
            # open issue" and create a duplicate on every tick.
            existing=$(gh issue list --state open --search "$TITLE in:title" --json number 2>/dev/null || true)
            if printf '%s' "$existing" | grep -q '"number"'; then
              echo "::notice::issue already open for $PHASE"
            else
              gh issue create --title "$TITLE" \
                --body "$(tail -60 "logs/${PHASE}.log" 2>/dev/null || echo 'see run logs')" || true
            fi
          fi

  # ---------------------------------------------------------------------------
  # retrigger: chain to the next phase ONLY if the pipeline actually advanced.
  #
  # Chaining unconditionally is how a failure becomes a storm: the phase defers
  # or fails, the run is still "successful" as far as Actions is concerned, so a
  # new run starts, hits the same wall, defers again, and five queued runs burn
  # MAX_DEFERRALS before anyone looks. A phase that did not progress is retried
  # by the cron safety net, on purpose, with a human-sized gap.
  # ---------------------------------------------------------------------------
  retrigger:
    needs: [select, work]
    if: >-
      always() && needs.select.outputs.exists == 'true' &&
      needs.select.outputs.action != 'audit' && needs.select.outputs.action != 'status' &&
      (inputs.no_retrigger != true) &&
      needs.work.result == 'success' &&
      needs.work.outputs.progress == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write            # repository_dispatch requires contents: write
    steps:
      - name: Chain to next tick
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ needs.select.outputs.phase }}
        run: |
          sleep 10
          gh api -X POST -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dispatches" \
            -f "event_type=rbops_tick" \
            -f "client_payload[phase]=${PHASE}" \
            -f "client_payload[reason]=phase_done_gate_green" \
            -f "client_payload[run_id]=${{ github.run_id }}" \
            || echo "::warning::re-dispatch failed — cron safety net retries in <=10 min"